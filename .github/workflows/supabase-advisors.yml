name: supabase-advisors

# PASTE 4.3 Part E — run the Supabase SECURITY + PERFORMANCE advisors AFTER a
# schema change. Every push / PR that touches database/migrations/** re-runs the
# advisors against the project, so a new migration that introduces an RLS gap,
# an unindexed foreign key, a mutable search_path, etc. is caught in CI instead
# of in production. A weekly schedule is the safety net for drift that lands
# outside a migration diff.
#
# Requires two repository secrets (Settings → Secrets and variables → Actions):
#   SUPABASE_ACCESS_TOKEN  — a personal access token (Supabase account settings)
#   SUPABASE_PROJECT_REF   — the project ref (e.g. otepdjhrawtqkzclaxbk)
# Neither is a database credential; the advisors API is read-only.

on:
  push:
    branches: [main]
    paths:
      - "database/migrations/**"
  pull_request:
    paths:
      - "database/migrations/**"
  schedule:
    # Weekly drift check — Mondays 02:00 UTC.
    - cron: "0 2 * * 1"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  advisors:
    name: Supabase security + performance advisors
    runs-on: ubuntu-latest
    steps:
      - name: Run advisors
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          set -euo pipefail

          if [ -z "${SUPABASE_ACCESS_TOKEN:-}" ] || [ -z "${SUPABASE_PROJECT_REF:-}" ]; then
            echo "::warning::SUPABASE_ACCESS_TOKEN / SUPABASE_PROJECT_REF not set — skipping advisors."
            echo "Add them in repo Settings → Secrets to enable the advisor gate."
            exit 0
          fi

          API="https://api.supabase.com/v1/projects/${SUPABASE_PROJECT_REF}/advisors"
          AUTH="Authorization: Bearer ${SUPABASE_ACCESS_TOKEN}"

          fetch () {
            # $1 = security | performance
            curl -sS -f -H "$AUTH" "${API}/$1" -o "advisors_$1.json"
          }

          echo "== Security advisor =="
          fetch security
          echo "== Performance advisor =="
          fetch performance

          # Summarize every lint (name, level, categories) for the log.
          summarize () {
            jq -r '.lints[]? | "  [\(.level)] \(.name) — \(.categories // [] | join(","))"' "advisors_$1.json" || true
          }
          echo "-- security lints --"; summarize security
          echo "-- performance lints --"; summarize performance

          # Gate: fail on any ERROR-level SECURITY lint. Two known-intentional
          # warnings are documented in DECISIONS.md (D-009 RLS helpers must be
          # authenticated-executable; leaked-password protection is a dashboard
          # toggle) — those are WARN, not ERROR, so they don't fail the build.
          SEC_ERRORS=$(jq '[.lints[]? | select(.level=="ERROR")] | length' advisors_security.json)
          echo "Security ERROR-level findings: ${SEC_ERRORS}"
          if [ "${SEC_ERRORS}" -gt 0 ]; then
            echo "::error::Supabase security advisor reported ${SEC_ERRORS} ERROR-level finding(s) after a schema change. Review advisors_security.json."
            jq -r '.lints[]? | select(.level=="ERROR") | "ERROR: \(.name) — \(.description)"' advisors_security.json
            exit 1
          fi

          echo "Advisors clean of ERROR-level security findings."

      - name: Upload advisor reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: supabase-advisors
          path: advisors_*.json
          if-no-files-found: ignore
