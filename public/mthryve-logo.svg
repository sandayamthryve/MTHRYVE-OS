<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 220" role="img" aria-labelledby="title desc">
  <title id="title">MThryve logo</title>
  <desc id="desc">Green, teal, and gold leaf mark forming an M above the THRYVE wordmark.</desc>
  <defs>
    <linearGradient id="tealLeaf" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d6f78"/>
      <stop offset="0.55" stop-color="#1aa0a2"/>
      <stop offset="1" stop-color="#7dd0b7"/>
    </linearGradient>
    <linearGradient id="greenLeaf" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1f6e3a"/>
      <stop offset="0.5" stop-color="#52b85a"/>
      <stop offset="1" stop-color="#a4e879"/>
    </linearGradient>
    <linearGradient id="goldLeaf" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#9b641e"/>
      <stop offset="0.5" stop-color="#e3b45f"/>
      <stop offset="1" stop-color="#fff0a4"/>
    </linearGradient>
    <linearGradient id="goldText" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff2b8"/>
      <stop offset="0.45" stop-color="#d7a956"/>
      <stop offset="1" stop-color="#8a5718"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.2" flood-color="#000" flood-opacity="0.28"/>
    </filter>
  </defs>

  <g filter="url(#softShadow)">
    <path d="M47 53 C37 70 35 92 39 117 C42 135 49 145 55 151 C64 137 68 119 66 101 C64 82 57 66 47 53 Z" fill="url(#tealLeaf)"/>
    <path d="M50 49 C77 49 100 60 119 78 C137 95 151 117 161 145 C144 142 126 134 110 120 C91 104 75 84 62 62 C58 56 54 52 50 49 Z" fill="url(#greenLeaf)"/>
    <path d="M62 57 C77 75 92 92 110 107 C123 118 138 127 153 133" fill="none" stroke="#bfe9a2" stroke-width="2.4" stroke-linecap="round" opacity="0.55"/>
    <path d="M131 81 C145 59 164 45 188 41 C182 57 169 75 148 95 Z" fill="url(#goldLeaf)"/>
    <path d="M176 67 C187 83 191 103 188 126 C186 139 182 148 177 154 C170 139 167 124 168 108 C169 93 171 80 176 67 Z" fill="url(#goldLeaf)"/>
    <path d="M145 88 C158 72 172 59 185 49" fill="none" stroke="#fff0a8" stroke-width="2" stroke-linecap="round" opacity="0.45"/>
    <path d="M177 78 C180 99 180 120 177 145" fill="none" stroke="#fff0a8" stroke-width="2" stroke-linecap="round" opacity="0.45"/>
  </g>

  <g fill="url(#goldText)" stroke="#7b4c15" stroke-width="0.35" font-family="Georgia, 'Times New Roman', serif" font-weight="600" font-size="28" letter-spacing="8">
    <text x="30" y="191">THRYVE</text>
  </g>
</svg>