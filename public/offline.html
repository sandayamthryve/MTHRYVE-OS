<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#080b11" />
    <title>You're offline · M-THRYVE OS</title>
    <style>
      :root { color-scheme: dark; }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body {
        height: 100%;
        background: #080b11;
        color: #e8ecec;
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        padding: calc(env(safe-area-inset-top) + 24px) 24px calc(env(safe-area-inset-bottom) + 24px);
        background-image:
          radial-gradient(900px 500px at 8% -5%, rgba(47, 168, 160, 0.14), transparent 60%),
          radial-gradient(800px 500px at 100% 108%, rgba(212, 169, 75, 0.08), transparent 55%);
      }
      .card { max-width: 26rem; width: 100%; text-align: center; }
      .mark {
        width: 64px; height: 64px; margin: 0 auto 24px;
        display: flex; align-items: center; justify-content: center;
        border-radius: 16px;
        background: linear-gradient(135deg, #5fd8cf, #2fa8a0);
        box-shadow: 0 6px 18px -4px rgba(47, 168, 160, 0.5);
        font-weight: 800; font-size: 34px; color: #0b0f11; letter-spacing: -0.04em;
      }
      h1 { font-size: 1.375rem; font-weight: 700; letter-spacing: -0.01em; margin-bottom: 10px; }
      p { color: #93a1a1; font-size: 0.95rem; line-height: 1.6; margin-bottom: 24px; }
      button {
        appearance: none; border: 0; cursor: pointer;
        min-height: 44px; padding: 0 20px;
        border-radius: 10px; font-size: 1rem; font-weight: 600;
        color: #0b0f11; background: linear-gradient(180deg, #4bc0b8, #2fa8a0);
        box-shadow: 0 6px 18px -4px rgba(47, 168, 160, 0.5);
      }
      button:active { filter: brightness(0.95); }
      .eyebrow {
        font-family: "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
        font-size: 10px; text-transform: uppercase; letter-spacing: 0.2em;
        color: #63727a; margin-bottom: 16px;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="mark" aria-hidden="true">M</div>
      <div class="eyebrow">M-THRYVE OS</div>
      <h1>You're offline</h1>
      <p>
        This page needs a live connection to load your data. Check your network
        and try again — your work is safe.
      </p>
      <button type="button" onclick="location.reload()">Retry</button>
    </div>
  </body>
</html>
